# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste`: unmaintained, compile-time-only proc-macro pulled in by iroh -> netwatch ->
  # netlink-packet-core. No vulnerability; no runtime code. Re-check when iroh updates.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only, transitive via iroh" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
