name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly advisory re-check

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GStreamer headers for the daemon)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (protocol, pairing, expiry, allowlist rejection, e2e over loopback QUIC)
        run: cargo test --workspace
      - name: Daemon without platform features
        run: cargo test -p dishus-daemon --no-default-features

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --deny warnings --ignore RUSTSEC-2024-0436
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-ndk
      - name: Build Rust core + Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./android/build-rust.sh
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: dishus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
