name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly advisory re-check

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (GStreamer headers for the daemon; plugins + Xvfb for the X11 test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config \
            gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (protocol, pairing, expiry, allowlist rejection, e2e over loopback QUIC)
        run: cargo test --workspace
      - name: Daemon without platform features
        run: cargo test -p dishus-daemon --no-default-features

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (Windows capture, input, ACLs, control pipe, plus the shared suite)
        run: cargo test --workspace
      # The release exe is built here, from the reviewed source, not on someone's PC.
      - name: Build the one-file Windows installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dishus-windows
          path: dist/*

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install --locked cargo-audit
          # RUSTSEC-2024-0436 (paste) and RUSTSEC-2026-0374 (basic-toml): unmaintained, no known
          # vulnerability, build-time only (iroh's netlink proc-macro; uniffi's binding generator).
          cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0374
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # the default list includes the long-removed 'tools' package, which now fails
          packages: platform-tools
      - name: NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-ndk
      - name: Build Rust core + Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./android/build-rust.sh
      # No gradlew wrapper jar is committed (no binaries in the repo); use a pinned Gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: dishus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
