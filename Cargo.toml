[workspace]
resolver = "3"
members = ["crates/dishus-proto", "crates/dishus-daemon", "crates/dishus-cli", "crates/dishus-core", "crates/dishus-win"]

[workspace.package]
version = "0.31.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dishus/dishus"
rust-version = "1.89"

[workspace.dependencies]
dishus-proto = { path = "crates/dishus-proto", version = "0.31.0" }
dishus-win = { path = "crates/dishus-win", version = "0.31.0" }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
data-encoding = "2.11"
bytes = "1"
toml = "1"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Android library build: like release, but panics unwind so UniFFI can turn a Rust panic into a
# Kotlin exception instead of killing the app (`panic = "abort"` would). Symbols are kept out of
# the APK by the strip setting inherited from release.
[profile.release-android]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
